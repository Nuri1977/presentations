<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rosetta DBT Studio in 15s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #05070b;
    --card: #12151b;
    --card2: #181b22;
    --card3: #1e222a;
    --line: rgba(255, 255, 255, 0.08);
    --line2: rgba(255, 255, 255, 0.14);
    --text: #f4f6fa;
    --muted: #a3acbb;
    --dim: #5f6878;
    --o: #ff7416;
    --o2: #ff9d3b;
    --o3: #df4c08;
    --blue: #62b8ff;
    --green: #5fd47a;
    --red: #ff6b61;
    --purple: #a78bfa;
    --teal: #34d3c0;
    --yellow: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #stage {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden;
    background: var(--bg); color: var(--text); transform-origin: 0 0;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .layer { position: absolute; inset: 0; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
  .grad {
    background: linear-gradient(180deg, #ffb054 4%, #ff7317 58%, #df4c08 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* ---------- background ---------- */
  .glow { position: absolute; left: 0; top: 0; border-radius: 50%; pointer-events: none; }
  #glowA { width: 1500px; height: 1500px; background: radial-gradient(circle, rgba(255,116,22,0.22), rgba(255,116,22,0) 62%); }
  #glowB { width: 1400px; height: 1400px; background: radial-gradient(circle, rgba(84,171,255,0.14), rgba(84,171,255,0) 62%); }
  #glowC { width: 1100px; height: 1100px; background: radial-gradient(circle, rgba(255,101,19,0.16), rgba(255,101,19,0) 62%); }
  #grid {
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 20%, transparent 80%);
    mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 20%, transparent 80%);
  }
  #vig { pointer-events: none; background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%); }

  /* ---------- scene 1: tool sprawl ---------- */
  .chip {
    position: absolute; left: 0; top: 0; min-width: 250px;
    background: rgba(20, 23, 30, 0.94); border: 1px solid var(--line2); border-radius: 12px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.55); overflow: hidden;
  }
  .chip-bar { height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: rgba(255,255,255,0.04); border-bottom: 1px solid var(--line); }
  .chip-bar i { width: 9px; height: 9px; border-radius: 50%; background: #3a404c; display: block; }
  .chip-bar span { margin-left: 8px; font-size: 15px; color: var(--muted); font-weight: 600; }
  .chip-body { padding: 13px 18px 15px; font-size: 21px; line-height: 1.55; color: #dfe4ec; white-space: pre; }
  .chip-body .ps { color: var(--o2); }
  .chip-body .err { color: var(--red); }
  .chip-body .dim { color: var(--dim); }
  .chip-body .key { color: var(--blue); }
  #s1text { position: absolute; left: 0; right: 0; top: 50%; text-align: center; transform: translateY(-50%); }
  .s1l { font-size: 118px; font-weight: 900; letter-spacing: -0.035em; line-height: 1.02; }
  .s1l .w { display: inline-block; margin: 0 0.05em; }
  #core { position: absolute; left: 960px; top: 540px; width: 460px; height: 460px; margin: -230px 0 0 -230px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,230,200,1) 0%, rgba(255,140,40,0.9) 16%, rgba(255,116,22,0.35) 38%, rgba(255,116,22,0) 68%); }

  /* ---------- scene 2: logo ---------- */
  #flash { background: radial-gradient(circle at 50% 50%, rgba(255,245,230,1) 0%, rgba(255,150,50,0.85) 22%, rgba(255,116,22,0.25) 50%, rgba(255,116,22,0) 75%); }
  #ring { position: absolute; left: 960px; top: 540px; width: 400px; height: 400px; margin: -200px 0 0 -200px; border-radius: 50%; border: 5px solid var(--o2); }
  .ray { position: absolute; left: 960px; top: 540px; width: 260px; height: 4px; margin-top: -2px; transform-origin: 0 50%; border-radius: 4px;
    background: linear-gradient(90deg, rgba(255,157,59,0), #ffb054 60%, #fff); }
  #lockup { position: absolute; left: 50%; top: 50%; display: flex; align-items: center; gap: 64px; transform: translate(-50%, -50%); white-space: nowrap; }
  #lk-icon { width: 330px; height: 330px; flex: 0 0 auto; }
  .logo-svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 26px 60px rgba(255,116,22,0.35)); }
  .logo-svg g, .logo-svg path { transform-box: fill-box; transform-origin: center; }
  .lk-ros { font-size: 42px; font-weight: 700; letter-spacing: 0.34em; color: #ffc08a; margin-left: 6px; }
  .lk-name { font-size: 164px; font-weight: 900; letter-spacing: -0.04em; line-height: 0.98; margin: 4px 0 18px; }
  .lk-tag { font-size: 34px; font-weight: 500; color: var(--muted); margin-left: 4px; }

  /* ---------- world + cards ---------- */
  #world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
  .card {
    position: absolute; width: 1200px; height: 720px; border-radius: 22px; overflow: hidden;
    background: linear-gradient(180deg, #14171e, #101318); border: 1px solid var(--line2);
    box-shadow: 0 50px 120px rgba(0,0,0,0.6);
  }
  .c-bar { position: absolute; left: 0; right: 0; top: 0; height: 56px; display: flex; align-items: center; padding: 0 22px; background: #0d0f14; border-bottom: 1px solid var(--line); }
  .dots { display: flex; gap: 9px; }
  .dots i { width: 13px; height: 13px; border-radius: 50%; display: block; }
  .dots i:nth-child(1) { background: #ff5f57; } .dots i:nth-child(2) { background: #febc2e; } .dots i:nth-child(3) { background: #28c840; }
  .c-tab { margin-left: 28px; height: 36px; padding: 0 16px; display: flex; align-items: center; gap: 10px; border-radius: 9px; background: #1a1d25; border: 1px solid var(--line); font-size: 17px; font-weight: 600; color: #e7ebf2; }
  .c-tab svg { width: 18px; height: 18px; color: var(--o2); }
  .c-brand { margin-left: auto; font-size: 15px; font-weight: 600; color: var(--dim); letter-spacing: 0.02em; }
  .c-body { position: absolute; left: 40px; top: 88px; width: 1120px; height: 600px; }
  .c-h { font-size: 22px; font-weight: 700; color: #e9edf3; }
  .c-sub { font-size: 16px; color: var(--muted); }
  .btn { display: inline-flex; align-items: center; gap: 9px; height: 42px; padding: 0 18px; border-radius: 10px; font-size: 17px; font-weight: 700; color: #e9edf3; background: #20242d; border: 1px solid var(--line2); }
  .btn svg { width: 17px; height: 17px; }
  .btn.pri { background: linear-gradient(180deg, #ff8a2e, #f06410); border-color: rgba(255,170,90,0.6); color: #fff; }
  .pill { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 15px; font-weight: 600; background: #1b1f27; border: 1px solid var(--line2); color: var(--muted); }
  .badge { background: #f5f6f8; border-radius: 16px; display: flex; align-items: center; justify-content: center; }
  .badge img { max-width: 70%; max-height: 70%; object-fit: contain; display: block; }

  /* card 1: connect */
  .tiles { position: absolute; left: 0; top: 66px; width: 1120px; display: grid; grid-template-columns: repeat(4, 262px); gap: 24px 24px; }
  .tile { height: 186px; border-radius: 16px; background: var(--card3); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .tile .badge { width: 92px; height: 92px; }
  .tile .tname { font-size: 19px; font-weight: 700; color: #e9edf3; }
  .search { position: absolute; right: 0; top: -4px; width: 380px; height: 44px; border-radius: 10px; background: #0d0f14; border: 1px solid var(--line2); display: flex; align-items: center; gap: 10px; padding: 0 14px; color: var(--dim); font-size: 16px; }
  .status { position: absolute; left: 0; right: 0; top: 520px; height: 64px; border-radius: 14px; background: rgba(95,212,122,0.08); border: 1px solid rgba(95,212,122,0.35); display: flex; align-items: center; gap: 14px; padding: 0 22px; font-size: 18px; font-weight: 700; color: #cff5d8; }
  .status .gdot { width: 12px; height: 12px; border-radius: 50%; background: var(--green); box-shadow: 0 0 14px var(--green); }
  .status .mono { font-weight: 500; color: var(--muted); font-size: 16px; }
  .status .ok { margin-left: auto; color: var(--green); }
  .cursor { position: absolute; left: 0; top: 0; width: 34px; height: 34px; z-index: 5; }
  .ripple { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 3px solid var(--o2); }

  /* card 2: lineage */
  .node { position: absolute; width: 228px; height: 58px; border-radius: 12px; background: #1b1f28; border: 1.5px solid; display: flex; align-items: center; gap: 12px; padding: 0 14px; font-size: 16.5px; font-weight: 500; color: #e9edf3; }
  .node .nb { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
  .colh { position: absolute; top: 52px; width: 228px; text-align: center; font-size: 14px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }
  .toast { position: absolute; right: 0; top: 536px; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-radius: 12px; background: #1c2a20; border: 1px solid rgba(95,212,122,0.4); color: #cff5d8; font-size: 17px; font-weight: 700; }

  /* card 3: run */
  .log { position: absolute; left: 0; top: 64px; width: 1120px; height: 386px; border-radius: 14px; background: #0a0c10; border: 1px solid var(--line); padding: 18px 24px; font-size: 17px; line-height: 32px; color: #cfd6e0; white-space: pre; overflow: hidden; }
  .log .l { display: block; }
  .log .ok { color: var(--green); } .log .dim { color: #4d5563; } .log .ps { color: var(--o2); } .log .mdl { color: #fff; }
  .prog { position: absolute; left: 0; top: 478px; width: 700px; }
  .prog .bar { height: 12px; border-radius: 6px; background: #1d2129; overflow: hidden; margin-top: 12px; }
  .prog .fill { height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, #ff8a2e, #5fd47a); }
  .done { position: absolute; right: 0; top: 472px; height: 76px; padding: 0 26px; border-radius: 16px; display: flex; align-items: center; gap: 14px; background: rgba(95,212,122,0.1); border: 1.5px solid rgba(95,212,122,0.5); color: #d6f7de; font-size: 22px; font-weight: 800; box-shadow: 0 0 50px rgba(95,212,122,0.18); }
  .done .ck { width: 38px; height: 38px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; }

  /* card 4: query */
  .editor { position: absolute; left: 0; top: 64px; width: 1120px; height: 232px; border-radius: 14px; background: #0a0c10; border: 1px solid var(--line); padding: 16px 0; font-size: 20px; line-height: 33px; overflow: hidden; }
  .gutter { position: absolute; left: 0; top: 16px; width: 58px; text-align: right; color: #3d4452; white-space: pre; }
  .code { position: absolute; left: 82px; top: 16px; white-space: pre; color: #dfe4ec; }
  .code .kw { color: #ff9d3b; font-weight: 700; } .code .fn { color: #62b8ff; } .code .str { color: #a5e07a; } .code .num { color: #c3a6ff; } .code .p { color: #8b94a4; }
  .caret { display: inline-block; width: 3px; height: 26px; background: var(--o2); vertical-align: -5px; margin-left: 1px; }
  .results { position: absolute; left: 0; top: 318px; width: 500px; height: 270px; border-radius: 14px; background: var(--card3); border: 1px solid var(--line); overflow: hidden; }
  .rrow { display: grid; grid-template-columns: 1fr 1fr; height: 35px; align-items: center; padding: 0 22px; font-size: 16.5px; border-bottom: 1px solid var(--line); }
  .rrow.h { height: 44px; font-weight: 800; color: var(--muted); font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; background: rgba(255,255,255,0.03); }
  .rrow span:last-child { text-align: right; }
  .chart { position: absolute; left: 524px; top: 318px; width: 596px; height: 270px; border-radius: 14px; background: var(--card3); border: 1px solid var(--line); }
  .cbar { position: absolute; bottom: 52px; width: 58px; border-radius: 8px 8px 3px 3px; background: linear-gradient(180deg, #ffb054, #ff7416 60%, #c9470a); transform-origin: 50% 100%; }
  .cval { position: absolute; width: 90px; margin-left: -16px; text-align: center; font-size: 14px; font-weight: 700; color: #ffd2a6; }
  .clab { position: absolute; bottom: 20px; width: 58px; text-align: center; font-size: 14px; font-weight: 600; color: var(--dim); }
  .meta { position: absolute; left: 0; top: 0; }

  /* card: analytics pages */
  .an-ed { position: absolute; left: 0; top: 64px; width: 500px; height: 524px; border-radius: 14px; background: #0a0c10; border: 1px solid var(--line); padding: 16px 0; font-size: 14px; line-height: 30px; overflow: hidden; }
  .an-ed .ln { display: block; position: relative; padding-left: 52px; white-space: pre; color: #dfe4ec; }
  .an-ed .ln i { position: absolute; left: 0; width: 34px; text-align: right; font-style: normal; color: #3d4452; }
  .an-ed .md { color: #fff; font-weight: 700; } .an-ed .fm { color: #7f8ba0; } .an-ed .fence { color: #8b94a4; } .an-ed .kw { color: #ff9d3b; font-weight: 700; }
  .an-ed .tag { color: #ff9d3b; } .an-ed .attr { color: #62b8ff; } .an-ed .val { color: #a5e07a; }
  .an-pv { position: absolute; left: 520px; top: 64px; width: 600px; height: 524px; border-radius: 14px; background: var(--card3); border: 1px solid var(--line); padding: 20px 22px; overflow: hidden; }
  .an-title { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
  .an-kpis { display: flex; gap: 14px; margin-top: 14px; }
  .kpi { flex: 1; height: 112px; border-radius: 12px; background: #151920; border: 1px solid var(--line); padding: 14px 18px; }
  .kpi .kl { font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
  .kpi .kv { font-size: 36px; font-weight: 900; margin-top: 4px; letter-spacing: -0.02em; }
  .kpi .kd { font-size: 14px; font-weight: 700; color: var(--green); margin-top: 2px; }
  .an-chart { position: absolute; left: 22px; top: 196px; width: 556px; height: 252px; border-radius: 12px; background: #151920; border: 1px solid var(--line); }
  .an-dot { transform-box: fill-box; transform-origin: center; }

  /* card 5: lakes */
  .lakehead { position: absolute; left: 0; top: 0; display: flex; gap: 16px; }
  .lakebadge { height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 18px 0 8px; border-radius: 14px; background: #1b1f28; border: 1px solid var(--line2); font-size: 19px; font-weight: 800; }
  .lakebadge .badge { width: 40px; height: 40px; border-radius: 10px; }
  .catalogs { position: absolute; right: 0; top: 10px; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; color: var(--dim); }
  .catalogs .badge { width: 34px; height: 34px; border-radius: 9px; }
  .lakebox { position: absolute; left: 0; top: 76px; width: 640px; height: 394px; border-radius: 16px; background: linear-gradient(180deg, #11151c, #0c1017); border: 1px solid var(--line); overflow: hidden; }
  .pq { position: absolute; left: 0; top: 0; height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 9px; border-radius: 10px; background: #232836; border: 1px solid rgba(98,184,255,0.45); font-size: 16px; font-weight: 600; color: #e3eefc; box-shadow: 0 12px 30px rgba(0,0,0,0.5); }
  .pq b { width: 18px; height: 22px; border-radius: 3px; background: linear-gradient(180deg, #62b8ff, #3a7fd4); display: block; }
  .tables { position: absolute; left: 670px; top: 76px; width: 450px; height: 394px; border-radius: 16px; background: var(--card3); border: 1px solid var(--line); padding: 18px 20px; }
  .trow { height: 62px; margin-top: 12px; border-radius: 12px; background: #151920; border: 1px solid var(--line); display: flex; align-items: center; gap: 14px; padding: 0 16px; font-size: 17px; }
  .trow .tag { margin-left: auto; font-family: Inter, sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 0.06em; padding: 5px 10px; border-radius: 999px; }
  .storage { position: absolute; left: 0; top: 498px; right: 0; height: 90px; border-radius: 16px; background: var(--card3); border: 1px solid var(--line); display: flex; align-items: center; gap: 18px; padding: 0 24px; }
  .storage .badge { width: 58px; height: 58px; border-radius: 13px; }
  .storage .lbl { font-size: 17px; font-weight: 700; color: var(--muted); margin-right: 8px; }

  /* card 6: ai */
  .agents { position: absolute; left: 0; top: 0; display: flex; gap: 10px; }
  .apill { height: 44px; display: flex; align-items: center; gap: 9px; padding: 0 18px; border-radius: 999px; background: #1b1f27; border: 1px solid var(--line2); font-size: 17px; font-weight: 700; color: var(--muted); }
  .apill.on { background: rgba(255,116,22,0.14); border-color: rgba(255,140,60,0.7); color: #ffd2a6; }
  .models { position: absolute; right: 0; top: 4px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--dim); }
  .models .badge { width: 36px; height: 36px; border-radius: 10px; }
  .umsg { position: absolute; right: 0; top: 76px; max-width: 640px; padding: 16px 22px; border-radius: 18px 18px 4px 18px; background: linear-gradient(180deg, #2c2016, #241a12); border: 1px solid rgba(255,140,60,0.45); font-size: 20px; font-weight: 600; color: #ffe7d2; }
  .arow { position: absolute; left: 0; top: 168px; display: flex; gap: 16px; align-items: flex-start; }
  .avatar { width: 46px; height: 46px; border-radius: 14px; background: linear-gradient(180deg, #ff9d3b, #e2560b); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; box-shadow: 0 8px 26px rgba(255,116,22,0.35); }
  .atext { font-size: 20px; line-height: 46px; color: #e9edf3; white-space: pre; }
  .tool { position: absolute; left: 62px; width: 820px; height: 58px; border-radius: 12px; background: #151920; border: 1px solid var(--line2); display: flex; align-items: center; gap: 14px; padding: 0 18px; font-size: 16.5px; }
  .tool .tn { font-family: Inter, sans-serif; font-weight: 800; color: #e9edf3; width: 104px; }
  .tool .ta { color: var(--muted); }
  .tool .st { margin-left: auto; width: 30px; height: 30px; position: relative; }
  .spin { position: absolute; inset: 3px; border-radius: 50%; border: 3px solid rgba(255,157,59,0.25); border-top-color: var(--o2); }
  .ck2 { position: absolute; inset: 0; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; }
  .allow { position: absolute; right: 64px; top: 10px; height: 36px; padding: 0 16px; border-radius: 9px; display: flex; align-items: center; gap: 8px; font-family: Inter, sans-serif; font-size: 15px; font-weight: 800; background: linear-gradient(180deg, #ff8a2e, #f06410); color: #fff; }
  .afinal { position: absolute; left: 62px; top: 462px; font-size: 19px; font-weight: 700; color: #cff5d8; display: flex; align-items: center; gap: 10px; }
  .ainput { position: absolute; left: 0; right: 0; top: 522px; height: 64px; border-radius: 14px; background: #0d0f14; border: 1px solid var(--line2); display: flex; align-items: center; padding: 0 20px; font-size: 18px; color: var(--dim); gap: 12px; }

  /* ---------- HUD ---------- */
  #scrim { background: linear-gradient(90deg, rgba(5,7,11,0.96) 0%, rgba(5,7,11,0.9) 28%, rgba(5,7,11,0) 42%); }
  .hud-item { position: absolute; left: 118px; top: 318px; width: 530px; }
  .hud-num { font-size: 22px; font-weight: 700; color: var(--o2); letter-spacing: 0.12em; }
  .hud-title { margin-top: 16px; font-size: 78px; font-weight: 900; line-height: 1.0; letter-spacing: -0.035em; }
  .hud-title .w, .hud-sub .w { display: inline-block; }
  .hud-title .w { margin-right: 0.05em; }
  .hud-sub { margin-top: 26px; font-size: 27px; line-height: 1.38; font-weight: 500; color: var(--muted); }
  #hud-prog { position: absolute; left: 118px; top: 800px; display: flex; gap: 10px; }
  #hud-prog div { width: 58px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden; }
  #hud-prog div i { display: block; height: 100%; width: 0; background: var(--o); }
  #ovText { position: absolute; left: 0; right: 0; top: 896px; text-align: center; font-size: 64px; font-weight: 900; letter-spacing: -0.03em; }
  #ovText .w { display: inline-block; margin: 0 0.05em; }

  /* ---------- end card ---------- */
  #end-lock { position: absolute; left: 0; right: 0; top: 196px; display: flex; flex-direction: column; align-items: center; }
  #end-icon { width: 250px; height: 250px; }

let flowPaths = [];

    let x1, y1, x2, y2;
    if (a.y === b.y) { const dir = Math.sign(b.x - a.x); x1 = a.x + dir * (CW / 2 + 30); x2 = b.x - dir * (CW / 2 + 30); y1 = y2 = a.y; }
    else { x1 = a.x - 200; y1 = a.y + CH / 2 + 34; x2 = b.x + 200; y2 = b.y - CH / 2 - 34; }
    segs.push({ x1, y1, x2, y2 });
  }
  const svg = `<svg width="5600" height="1800" style="position:absolute;left:-20px;top:-20px;overflow:visible">

    ${segs.map((s) => `<path d="M${s.x1 + 20} ${s.y1 + 20} L${s.x2 + 20} ${s.y2 + 20}" pathLength="1" stroke="#ff9d3b" stroke-width="16" stroke-linecap="round" fill="none" stroke-dasharray="1" stroke-dashoffset="1" marker-end="url(#ah)"/>`).join('')}

    const p = E.inCubic(P(t, 3.75, 4.1));
    const cx = lkIconCenter.x, cy = lkIconCenter.y;
    w.style.clipPath = `circle(${p * 2300}px at ${cx}px ${cy}px)`;
    w.style.webkitMaskImage = 'none'; w.style.maskImage = 'none';
  } else {
    const p = E.inOutCubic(P(t, 4.1, 4.55));
    const r = p * 2300;
    w.style.clipPath = 'none';
    const m = `radial-gradient(circle at 1290px 560px, transparent ${r}px, #000 ${r + 1.5}px)`;
    w.style.webkitMaskImage = m; w.style.maskImage = m;
  }
}

/* =========================================================================
   Frame
   ========================================================================= */
function render(t) {
  t = clamp(t, 0, DURATION - 1e-6);
  const c = cam(t);
  renderBG(t, c);
  renderS1(t);
  renderS2(t);
  renderWorld(t, c);
  renderHUD(t);
  renderEnd(t);
  renderWipe(t);
}

buildS1(); buildS2(); buildWorld(); buildHUD(); buildEnd();

const capture = new URLSearchParams(location.search).has('capture');
window.seek = (t) => render(t / PACE);   // t in real seconds
window.DURATION = DURATION * PACE;
window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; }))));
  measureS2();
  render(0);
  return true;
})();

if (!capture) {
  const stage = $('#stage');
  const fit = () => {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px, ${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
  };
  addEventListener('resize', fit); fit();
  let playing = true, tNow = 0, last = null;
  const ctl = $('#ctl');
  const loop = (ms) => {
    if (last != null && playing) tNow = (tNow + (ms - last) / 1000) % (DURATION * PACE);
    last = ms;
    render(tNow / PACE);
    ctl.textContent = `${tNow.toFixed(2)}s / ${DURATION * PACE}s   space: pause · ←/→: scrub`;
    requestAnimationFrame(loop);
  };
  window.ready.then(() => requestAnimationFrame(loop));
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { playing = !playing; e.preventDefault(); }
    if (e.code === 'ArrowRight') tNow = Math.min(DURATION * PACE - 0.01, tNow + (e.shiftKey ? 1 : 0.1));
    if (e.code === 'ArrowLeft') tNow = Math.max(0, tNow - (e.shiftKey ? 1 : 0.1));
  });
} else {
  $('#ctl').remove();
}
</script>
</body>
