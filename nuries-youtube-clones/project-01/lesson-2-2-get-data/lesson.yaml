scenes:
  - id: s00
    kind: title
    slide: title
    show: "Project 1 · Lesson 2.2. Get the data. Badges: Parquet, sources.yml, Seed CSV."

  - id: s01
    kind: slide
    chapter: "Sources and seeds"
    slide: sources
    beats:
      - { id: b01, step: 1, show: "Source card: big raw files stay outside git; 12 parquet files in data/raw, loaded once into the DuckDB table raw.green_trips; sources.yml declares it.", say: "Our raw data is twelve parquet files, one per month of 2025. They are too big for git, so they stay in a data folder that git ignores. We load them once into a DuckDB table, raw green trips, and a source, in sources dot yml, tells dbt about it." }
      - { id: b02, step: 2, show: "Seed card: a small CSV that lives in the repo; seeds/taxi_zone_lookup.csv, 265 zones.", say: "The second file is small: a lookup of the 265 taxi zones. Small CSV files like this one are seeds. They live in the repository, and dbt loads them as tables." }

  - id: s02
    kind: slide
    chapter: "Download the files"
    slide: download
    beats:
      - { id: b03, step: 1, show: "TLC Trip Record Data page path: 2025, each month, Green Taxi Trip Records; file URL pattern; target tree data/raw.", say: "The files come from the New York City Taxi and Limousine Commission website. Under 2025, download Green Taxi Trip Records for each month, January to December. The links are in the description." }
      - { id: b04, step: 2, show: "Taxi Zone Lookup Table, CSV link; the tree shows seeds/taxi_zone_lookup.csv.", say: "Further down the same page, download the Taxi Zone Lookup Table, as CSV." }

  - id: s03
    kind: app
    chapter: "Put the files in the project"
    beats:
      - id: b05
        say: "In Studio, open the nyc taxi project. Right-click the project, choose New Folder, and call it data."
        actions:
          - open_project: nyc_taxi
          - new_root_folder: data
      - id: b06
        say: "Inside data, make a folder called raw."
        actions:
          - new_folder: { parent: data, name: raw }
      - id: b07
        say: "Now move the twelve parquet files into data, raw, and the zone lookup CSV into seeds. Refresh the explorer, and there they are."
        zoom: explorer
        actions:
          - copy_in: { from: ../.cache/data/raw, to: data/raw, settleMs: 500 }
          - copy_in: { from: ../.cache/data/taxi_zone_lookup.csv, to: seeds/taxi_zone_lookup.csv, settleMs: 500 }
          - refresh_explorer
          - expand: data/raw
          - expand: seeds
          - point_tree: data/raw/green_tripdata_2025-12.parquet
          - point_tree: seeds/taxi_zone_lookup.csv

  - id: s04
    kind: app
    chapter: "Load the files into DuckDB"
    beats:
      - id: b08
        say: "Now load the files into DuckDB. Open the SQL Editor, and pick the nyc taxi dev connection."
        zoom: explorer
        actions:
          - nav: SQL Editor
          - sql_connection: nyc_taxi_dev
      - id: b09
        say: "Three statements, one per line. Create a schema called raw. Create the table raw green trips, from read parquet over all twelve files: use the full path of your data raw folder. Then count the rows."
        zoom: explorer
        actions:
          - type: "create schema raw;\ncreate table raw.green_trips as select * from read_parquet('/Users/Shared/academy/learner/projects/nyc_taxi/data/raw/green_tripdata_2025-*.parquet', union_by_name = true);\nselect count(*) as trips from raw.green_trips;"
      - id: b10
        say: "Run them one by one, with the green arrow next to each line. Union by name lines up the columns, even if a month's file has them in a different order."
        zoom: explorer
        actions:
          - sql_run: { line: 1, settleMs: [400, 1200, 2500] }
          - sql_run: { line: 2, settleMs: [500, 1500, 3000, 6000, 9000] }
          - sql_run: { line: 3 }
      - id: b11
        say: "Five hundred ninety-one thousand, three hundred seventy-five trips in 2025, now in one DuckDB table."
        zoom: sql-results
        card: { eyebrow: "raw.green_trips · 2025 data, as of 9 Nov 2026", title: "591,375 trips", sub: "all 12 files, loaded once", pos: top-right }

  - id: s05
    kind: app
    chapter: "Declare the source"
    beats:
      - id: b12
        say: "Back in the project, tell dbt about the table. Right-click models, New File, and call it sources dot yml."
        zoom: explorer
        actions:
          - nav: DBT Studio
          - new_file: { folder: models, name: sources.yml }
      - id: b13
        say: "A source called raw, the schema we just made, with a short description."
        zoom: code-close
        actions:
          - type: "sources:\n  - name: raw\n    description: NYC TLC green taxi trip records for 2025, loaded from data/raw into DuckDB.\n"
      - id: b13b
        say: "It has one table, green trips: one row per green taxi trip. Save. In a model, source raw, green trips, now points at that table."
        zoom: code-close
        card: { eyebrow: "source('raw', 'green_trips')", title: "nyc_taxi_dev.raw.green_trips", sub: "No file paths in the models.", pos: top-right }
        actions:
          - type: "    tables:\n      - name: green_trips\n        description: One row per green taxi trip, as reported to the TLC.\n"
          - click_save
          - expect_file: { path: models/sources.yml, snippet: ../snippets/2.2/sources.yml }

  - id: s06
    kind: app
    chapter: "Commit and push"
    beats:
      - id: b14
        say: "Now the Git tab. Only two files changed: sources dot yml and the CSV. The parquet files are not here, because the gitignore leaves out the data folder."
        zoom: git-panel
        actions:
          - close_tab: models/sources.yml
          - git_tab
      - id: b15
        say: "Stage all, type a message, declare the raw trips source and add the zone lookup, and commit."
        zoom: git-panel
        actions:
          - git_stage_all
          - git_message: Declare the raw trips source and add the zone lookup
          - git_commit
      - id: b16
        say: "Then click Sync Changes. Studio pushes the commit to GitHub."
        zoom: git-panel
        actions:
          - git_push

  - id: s07
    kind: browser
    chapter: "On GitHub"
    beats:
      - id: b17
        say: "On GitHub, the repository now has the models and seeds folders, and the latest commit message."
        zoom: center-wide
        actions:
          - goto: https://github.com/Nuri1977/nyc-taxi-dbt

  - id: s08
    kind: slide
    chapter: "Recap"
    slide: recap
    beats:
      - { id: b18, step: 1, show: "Recap: trips in data/raw, loaded into raw.green_trips (591,375 rows); zones in seeds; sources.yml declares the source; two files in git; pushed with Sync Changes.", say: "To recap: the trip files sit in data raw, outside git, and live in DuckDB as raw green trips. The zone lookup is a seed. And sources dot yml declares the source. Next, we build our first model on top of it." }

  - id: s09
    kind: closing
    slide: closing
    show: "Next · Lesson 2.3 · Models. Code: github.com/Nuri1977/nyc-taxi-dbt."
