summary: "Add continuous integration to the nyc_taxi dbt project: a prod profile, pinned requirements, a script that downloads the TLC files, and a GitHub Actions workflow that runs dbt build on every push and publishes the DuckDB warehouse as a release asset. Created in Rosetta DBT Studio, pushed from its Git tab, and checked on GitHub."
