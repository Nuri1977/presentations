scenes:
  - id: s00
    kind: title
    slide: title
    show: "Project 1 · Lesson 3.1. Ship & Automate. Badges: GitHub Actions, prod target, release."

  - id: s01
    kind: slide
    chapter: "Dev, prod and CI"
    slide: devprod
    beats:
      - { id: b01, step: 1, show: "dev: your laptop, Studio, nyc_taxi_dev.duckdb. prod: a clean machine, built from git, prod.duckdb.", say: "So far, everything ran on our laptop, in the dev target. Production should be built somewhere clean, only from what is in git." }
      - { id: b02, step: 2, show: "CI: on every push, GitHub Actions installs dbt, downloads the data, runs dbt build, publishes prod.duckdb.", say: "That is what CI does. On every push, GitHub Actions starts a fresh machine, installs dbt, downloads the data, runs dbt build, and publishes the warehouse." }

  - id: s02
    kind: app
    chapter: "Four files"
    beats:
      - id: b03
        say: "Open the project. First, requirements dot text in the project root: the same dbt versions Studio uses."
        zoom: explorer
        actions:
          - open_project: nyc_taxi
          - new_root_file: requirements.txt
          - type: "dbt-core==1.12.6\ndbt-duckdb==1.11.1\n"
          - click_save
          - expect_file: { path: requirements.txt, snippet: ../snippets/3.1/requirements.txt }
      - id: b04
        say: "Next, a folder called c i, with its own profiles dot yml: a prod target, and the database path from an environment variable."
        zoom: explorer
        actions:
          - close_tab: requirements.txt
          - new_root_folder: ci
          - new_file: { folder: ci, name: profiles.yml }
      - id: b05
        say: "Type the profile: nyc taxi, target prod, type duckdb, and the path from env var duckdb path."
        zoom: code-close
        actions:
          - type: "nyc_taxi:\n  target: prod\n  outputs:\n    prod:\n      type: duckdb\n      path: \"{{ env_var('DUCKDB_PATH') }}\"\n      threads: 4\n"
          - click_save
          - expect_file: { path: ci/profiles.yml, snippet: ../snippets/3.1/profiles.yml }
      - id: b06
        say: "The parquet files are not in git, so CI has to get the data itself. A folder called scripts, and download data dot py."
        zoom: explorer
        actions:
          - close_tab: ci/profiles.yml
          - new_root_folder: scripts
          - new_file: { folder: scripts, name: download_data.py }
      - id: b07
        say: "Paste the script. It downloads the twelve files into data raw, then loads them into raw green trips in the DuckDB file, the same load we did by hand in the SQL Editor. Save."
        zoom: code-mid
        actions:
          - paste: "\"\"\"Download the 2025 NYC TLC green taxi trip files into data/raw/ and load them into\nraw.green_trips in the DuckDB file at DUCKDB_PATH. Run from the repo root.\"\"\"\nimport os\nimport urllib.request\nfrom pathlib import Path\n\nimport duckdb\n\nBASE = \"https://d37ci6vzurychx.cloudfront.net/trip-data\"\nRAW = Path(\"data/raw\")\n\nRAW.mkdir(parents=True, exist_ok=True)\nfor month in range(1, 13):\n    name = f\"green_tripdata_2025-{month:02d}.parquet\"\n    target = RAW / name\n    if target.exists():\n        print(\"have\", name)\n        continue\n    print(\"downloading\", name)\n    request = urllib.request.Request(f\"{BASE}/{name}\", headers={\"User-Agent\": \"nyc-taxi-dbt-course\"})\n    with urllib.request.urlopen(request) as response:\n        target.write_bytes(response.read())\n\ncon = duckdb.connect(os.environ[\"DUCKDB_PATH\"])\ncon.execute(\"create schema if not exists raw\")\ncon.execute(\"create or replace table raw.green_trips as \"\n            \"select * from read_parquet('data/raw/green_tripdata_2025-*.parquet', union_by_name = true)\")\nprint(\"loaded\", con.execute(\"select count(*) from raw.green_trips\").fetchone()[0], \"rows\")\ncon.close()\n"
          - click_save
          - expect_file: { path: scripts/download_data.py, snippet: ../snippets/3.1/download_data.py }
      - id: b08
        say: "And the workflow. GitHub looks for it in dot github, workflows. Make both folders, and a file: dbt build dot yml."
        zoom: explorer
        actions:
          - close_tab: scripts/download_data.py
          - new_root_folder: .github
          - new_folder: { parent: .github, name: workflows }
          - new_file: { folder: .github/workflows, name: dbt_build.yml }
      - id: b09
        say: "Paste the workflow, and save."
        zoom: code-mid
        actions:
          - paste: "name: dbt build & publish\non:\n  push:\n    branches: [main]\n  schedule:\n    - cron: '23 5 * * 1'     # every Monday\n  workflow_dispatch:\npermissions:\n  contents: write\njobs:\n  build:\n    runs-on: ubuntu-latest\n    env:\n      DUCKDB_PATH: ${{ github.workspace }}/data/prod.duckdb\n    steps:\n      - uses: actions/checkout@v7\n      - uses: actions/setup-python@v7\n        with:\n          python-version: '3.10'\n          cache: pip\n      - run: pip install -r requirements.txt\n      - run: python scripts/download_data.py\n      - run: dbt build --profiles-dir ci\n      - name: Publish the warehouse\n        run: |\n          gh release create warehouse --title \"Warehouse\" --notes \"Built by dbt on every push\" || true\n          gh release upload warehouse data/prod.duckdb --clobber\n        env:\n          GH_TOKEN: ${{ github.token }}\n"
          - click_save
          - expect_file: { path: .github/workflows/dbt_build.yml, snippet: ../snippets/3.1/dbt_build.yml }

  - id: s03
    kind: slide
    chapter: "The workflow, step by step"
    slide: workflow
    beats:
      - { id: b10, step: 1, show: "Triggers: push to main, every Monday, or by hand. Permission: write releases.", say: "It runs on every push to main, every Monday morning, or by hand. It may write releases." }
      - { id: b11, step: 2, show: "Steps: checkout; Python 3.10; pip install -r requirements.txt; download and load the data; dbt build --profiles-dir ci; publish prod.duckdb to the release called warehouse.", say: "The steps: check out the code, set up Python, install dbt, download and load the data, run dbt build with the c i profile, and upload prod dot duckdb to a release called warehouse." }

  - id: s04
    kind: app
    chapter: "Commit and push"
    beats:
      - id: b12
        say: "Open the Git tab: four new files."
        zoom: git-panel
        actions:
          - close_tab: .github/workflows/dbt_build.yml
          - git_tab
      - id: b13
        say: "Stage all, type a message, add CI: build, test and publish the warehouse. Commit."
        zoom: git-panel
        actions:
          - git_stage_all
          - git_message: "Add CI: build, test and publish the warehouse"
          - git_commit
      - id: b14
        say: "Sync Changes. This push starts the first run."
        zoom: git-panel
        actions:
          - git_push

  - id: s05
    kind: browser
    chapter: "The run on GitHub"
    beats:
      - id: b15
        say: "On GitHub, open the Actions tab. The run for our commit is there."
        actions:
          - goto: https://github.com/Nuri1977/nyc-taxi-dbt/actions
      - id: b16
        say: "Open it, and wait. A fresh machine installs dbt, downloads and loads the files, and builds the project. Under a minute later: success."
        actions:
          - wait_text: { text: "Add CI: build, test and publish the warehouse", timeoutMs: 90000, label: run listed }
          - click_at: { role: link, name: "Add CI: build, test and publish the warehouse", label: the run, settleMs: [800, 2500] }
          - wait_text: { text: "^Success$", regex: true, timeoutMs: 900000, everyMs: 4000, label: CI run }
      - id: b17
        say: "And under Releases, the warehouse release, with prod dot duckdb attached: the whole warehouse, built by CI."
        actions:
          - goto: https://github.com/Nuri1977/nyc-taxi-dbt/releases/tag/warehouse

  - id: s06
    kind: slide
    chapter: "Recap"
    slide: recap
    beats:
      - { id: b18, step: 1, show: "Recap: prod profile; pinned requirements; download script; workflow; every push builds, tests and publishes prod.duckdb.", say: "To recap: a prod profile, pinned versions, a download script, and one workflow. From now on, every push builds and tests the project on a clean machine, and publishes the warehouse. Next, we make it a showcase." }

  - id: s07
    kind: closing
    slide: closing
    show: "Next · Lesson 3.2 · Showcase. Code: github.com/Nuri1977/nyc-taxi-dbt."
