        say: "In Studio, open the workflow file, and paste three more build steps at the end: generate the docs, copy the site files, and upload them for Pages."
        zoom: code-mid
        actions:
          - open_project: nyc_taxi
          - open_file: .github/workflows/dbt_build.yml
          - paste: { text: "      - run: dbt docs generate --profiles-dir ci\n      - run: mkdir site && cp target/index.html target/manifest.json target/catalog.json site/\n      - uses: actions/upload-pages-artifact@v5\n        with:\n          path: site\n  docs:\n    needs: build\n    runs-on: ubuntu-latest\n    permissions:\n      pages: write\n      id-token: write\n    environment:\n      name: github-pages\n      url: ${{ steps.deploy.outputs.page_url }}\n    steps:\n      - id: deploy\n        uses: actions/deploy-pages@v5\n", end: true }
