scenes:
  - id: s00
    kind: title
    slide: title
    show: "Project 1 · Lesson 2.3. Models: your first dbt model. dbt + DuckDB in Rosetta DBT Studio. Badges: Rosetta DBT Studio 1.7.6, dbt Core 1.12, DuckDB, NYC taxi 2025."

  - id: s01
    kind: slide
    chapter: "What a model is"
    slide: model
    beats:
      - { id: b01, step: 1, show: "Big statement: A model is one select, in one .sql file. A file card trips.sql with a select.", say: "In the last lesson, we pointed dbt at the raw taxi files. Now we build on top of them, with a model. A model is one select statement, saved in one .sql file, in the models folder." }
      - { id: b02, step: 2, show: "An arrow from the file to a DuckDB object card: view main.trips, named after the file.", say: "When you run it, dbt builds a view or a table from that select, and names it after the file. So trips.sql becomes a view called trips." }

  - id: s02
    kind: app
    chapter: "Write trips.sql in Rosetta DBT Studio"
    beats:
      - id: b03
        say: "Here is the project from the last lesson. Open it, right-click the models folder, choose New File, and call it trips.sql."
        zoom: explorer
        actions:
          - open_project: nyc_taxi
          - new_file: { folder: models, name: trips.sql }
      - id: b04
        say: "Start with a comment that says what one row is: one green taxi trip from 2025. Then, select."
        zoom: code-close
        actions:
          - type: |
              -- one row per 2025 green taxi trip, obviously broken rows removed
              select
      - id: b05
        say: "Pick the columns we need, and give them clear names: the vendor, the pickup and drop-off times, and the pickup and drop-off zones."
        zoom: code-close
        actions:
          - type: |2
                  VendorID              as vendor_id,
                  lpep_pickup_datetime  as pickup_at,
                  lpep_dropoff_datetime as dropoff_at,
                  PULocationID          as pickup_zone_id,
                  DOLocationID          as dropoff_zone_id,
      - id: b06
        say: "Then the passenger count, the distance, how the rider paid, and the money: fare, tip, and total."
        zoom: code-close
        actions:
          - type: |2
                  passenger_count,
                  trip_distance,
                  payment_type,
                  fare_amount,
                  tip_amount,
                  total_amount
      - id: b07
        say: "Read them from the raw green trips source. The source function points at the table we loaded and declared in the last lesson."
        zoom: code-close
        card: { eyebrow: "source()", title: "No file paths in the model", sub: "sources.yml says where raw.green_trips lives.", pos: top-right }
        actions:
          - type: |
              from {{ source('raw', 'green_trips') }}
      - id: b08
        say: "Finally, keep only trips that started in 2025, and drop the rows with no distance, or no charge."
        zoom: code-close
        actions:
          - type: |
              where lpep_pickup_datetime >= '2025-01-01'
                and lpep_pickup_datetime <  '2026-01-01'
                and trip_distance > 0
                and total_amount > 0
      - id: b09
        say: "That is the whole model. One select, and no create statement. Save it."
        actions:
          - click_save
          - expect_file: { path: models/trips.sql, snippet: ../snippets/3.3/trips.sql }

  - id: s03
    kind: slide
    chapter: "How dbt runs a model"
    slide: flow
    beats:
      - { id: b10, step: 1, show: "Step 1, Compile: the Jinja in curly braces becomes SQL; source('raw','green_trips') becomes \"nyc_taxi_dev\".\"raw\".\"green_trips\".", say: "So what happens when you run it? First, dbt compiles the file. The Jinja in curly braces becomes plain SQL, and the source call becomes the real table name." }
      - { id: b11, step: 2, show: "Step 2, Wrap: create view trips as ( your select ). Label: dbt writes this.", say: "Then dbt wraps your select in a create view statement. That is the part you never write." }
      - { id: b12, step: 3, show: "Step 3, Execute: the statement goes to DuckDB; nyc_taxi_dev.duckdb now holds the view main.trips.", say: "And it sends the statement to DuckDB, which saves the view in the dev database file." }

  - id: s04
    kind: app
    chapter: "Run the model"
    beats:
      - id: b13
        say: "Let's run it. Above the editor, open the Model menu, and choose Run. It runs just this model."
        zoom: model-menu
        actions:
          - model_menu: Run
      - id: b14
        say: "The terminal shows one model, trips, created as a view in the main schema. One pass, no errors."
        zoom: terminal-close
        card: { eyebrow: "dbt run", title: "OK created sql view model main.trips", sub: "PASS=1 ERROR=0", pos: top-right }
        actions:
          - wait_text: { text: "OK created sql view model main.trips", label: run output }

  - id: s05
    kind: app
    chapter: "Preview the rows"
    beats:
      - id: b15
        say: "To look at the rows, open the Model menu again, and choose Preview. Studio compiles the model, runs its select, and opens the result."
        zoom: model-menu
        actions:
          - model_menu: Preview
          - wait_text: { text: "^Preview: trips$", regex: true, label: preview window, timeoutMs: 90000 }
      - id: b16
        say: "Eleven columns, and five hundred sixty-five thousand trips, out of five hundred ninety-one thousand raw rows. Scroll right for the distance, the payment type and the amounts."
        zoom: center-wide
        card: { eyebrow: "2025 data, as of 9 Nov 2026", title: "565,039 trips", sub: "kept from 591,375 raw rows", pos: top-right }
        actions:
          - dialog_scroll_right
      - id: b16b
        say: "Close it. The same rows stay in the Query Results tab, next to the SQL that ran, and a history of your previews."
        zoom: terminal
        actions:
          - click_at: { role: button, name: Close, label: Close, settleMs: [300, 800] }
          - click_at: { role: tab, name: SQL, label: SQL tab, settleMs: [300, 900] }
          - click_at: { role: tab, name: History, label: History tab, settleMs: [300, 900] }

  - id: s06
    kind: app
    chapter: "The SQL dbt wrote, and the run history"
    beats:
      - id: b17
        say: "Want to see exactly what dbt sends to DuckDB? Model menu, Compile."
        zoom: model-menu
        actions:
          - model_menu: Compile
          - wait_text: { text: "^Compiled SQL: trips$", regex: true, label: compiled window, timeoutMs: 60000 }
      - id: b18
        say: "The Compiled SQL tab shows your select, with the source call replaced by the real table: nyc taxi dev, raw, green trips."
        zoom: center-wide
        card: { eyebrow: "Compiled SQL", title: "source() → raw.green_trips", sub: "Jinja became plain SQL.", pos: bottom-right }
        actions:
          - click_at: { role: tab, name: "Compiled SQL", label: Compiled SQL tab, settleMs: [300, 900] }
      - id: b19
        say: "Close it, and open Run History. Every dbt command Studio ran is here: dbt run, select trips, one of one passed."
        zoom: terminal
        actions:
          - click_at: { role: button, name: Close, label: Close, settleMs: [300, 800] }
          - click_at: { role: button, name: "RUN HISTORY", label: Run History, settleMs: [400, 1200, 2200] }

  - id: s07
    kind: app
    chapter: "Commit the model"
    beats:
      - id: b20
        say: "Last step: commit and push. Open the Git tab. Trips.sql is listed as a new file. The target and logs folders are not, because git ignores them."
        zoom: git-panel
        actions:
          - git_tab
      - id: b21
        say: "Stage it with the plus button, type a message, add the trips staging model, and click Commit."
        zoom: git-panel
        actions:
          - git_stage: trips.sql
          - git_message: Add the trips staging model
          - git_commit
      - id: b22
        say: "Click Sync Changes, and the commit goes to GitHub."
        zoom: git-panel
        actions:
          - git_push

  - id: s07b
    kind: browser
    chapter: "On GitHub"
    beats:
      - id: b22b
        say: "On GitHub, the models folder now holds trips dot sql, next to sources dot yml."
        zoom: center-wide
        actions:
          - goto: https://github.com/Nuri1977/nyc-taxi-dbt/tree/main/models

  - id: s08
    kind: slide
    chapter: "Recap"
    slide: recap
    beats:
      - { id: b23, step: 1, show: "Recap: A model is one select in one .sql file. Run: compile, wrap in create view, execute in DuckDB. Preview shows the rows, Compile the SQL, Run History the runs. Commit and push in the Git tab.", say: "To recap. A model is one select in one file. dbt compiles it, wraps it in create view, and runs it in DuckDB. Preview shows the rows, and the Git tab sends it to GitHub. Next, we add two more models that build on trips." }

  - id: s09
    kind: closing
    slide: closing
    show: "Next · Lesson 2.4 · Dependencies & Jinja. Code: github.com/Nuri1977/nyc-taxi-dbt."
