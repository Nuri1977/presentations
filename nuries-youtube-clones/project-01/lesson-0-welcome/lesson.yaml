      - { id: b06, step: 5, show: "Right column: GitHub Actions builds on every change and publishes prod.duckdb; label: anyone can query it.", say: "Finally, GitHub Actions rebuilds everything on every change, and publishes the finished DuckDB database, so anyone can query it." }

