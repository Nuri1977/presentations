      - { id: b01, step: 1, show: "Big statement: From raw files to a tested, automated pipeline. Under it: Rosetta DBT Studio · dbt Core · DuckDB · GitHub.", say: "Welcome to Project 1. In this course, you build a real analytics project with dbt and DuckDB. You start from an empty folder, and finish with a tested, automated pipeline, all inside Rosetta DBT Studio." }

