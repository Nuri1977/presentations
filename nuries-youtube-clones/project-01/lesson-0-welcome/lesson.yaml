    beats:
      - { id: b02, step: 1, show: "Left column of the DAG: 12 parquet files (2025 green taxi trips) and taxi_zone_lookup.csv.", say: "We start with a full year of New York City green taxi trips: twelve monthly parquet files, and a small lookup table of taxi zones." }
      - { id: b03, step: 2, show: "An arrow to the model trips (view): one clean row per trip.", say: "dbt turns the raw files into one clean model of trips." }
      - { id: b04, step: 3, show: "Three tables appear: trips_per_month, top_pickup_zones, monthly_summary.", say: "On top of it, three small tables: trips per month and borough, the busiest pickup zones, and a monthly summary of how riders pay." }
