    kind: slide
    chapter: "The tools"
    slide: tools
    beats:
      - { id: b10, step: 1, show: "Rosetta DBT Studio card: one app with editor, terminal, lineage and git; installs Python and dbt Core for you; open source.", say: "You need one app: Rosetta DBT Studio. It is open source, it installs Python and dbt Core for you, and it gives you an editor, a terminal, lineage, and git, in one window." }
      - { id: b11, step: 2, show: "DuckDB card: a database in one file, no server. GitHub card: keeps the code, runs the pipeline.", say: "DuckDB is the database. It lives in a single file on your computer, so there is no server to set up. And GitHub keeps your code, and later runs the pipeline for you." }

