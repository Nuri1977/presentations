      - { id: b09, step: 3, show: "Zone card: taxi_zone_lookup.csv, 265 zones; example row 74 · East Harlem North · Manhattan; joined on the pickup zone.", say: "A second file maps every zone number to its name and borough. Zone seventy-four, for example, is East Harlem North, in Manhattan, the busiest pickup zone of the year." }

