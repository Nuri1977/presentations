    kind: slide
    chapter: "The data"
    slide: data
    beats:
      - { id: b07, step: 1, show: "Trip card: the columns we use, pickup and drop-off time, zones, distance, payment type, fare, tip, total. Source: NYC TLC Trip Record Data.", say: "The data comes from the New York City Taxi and Limousine Commission, the TLC. Every trip has its pickup and drop-off time, the pickup and drop-off zones, the distance, how the rider paid, and what it cost." }
