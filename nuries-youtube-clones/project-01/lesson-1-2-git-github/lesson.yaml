summary: "Why a dbt project lives in git, how changes travel from your folder to GitHub (commit, push, pull request), and creating the empty GitHub repository the course project will use. Pushing needs a personal access token, which we set up before the first push."
tags: [git, GitHub, version control, pull request, dbt project]
