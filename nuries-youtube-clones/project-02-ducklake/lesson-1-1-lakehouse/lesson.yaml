    slide: warehouse
    beats:
      - { id: b01, step: 1, show: "Warehouse box: storage and compute in one system; data goes in through its own loader.", say: "Let's start with the classic data warehouse. One system owns everything: the storage, and the engine that runs your queries. Data goes in through the warehouse's own door." }
      - { id: b02, step: 2, show: "Pros: fast, safe, transactions. Cons: the data lives in its format; one engine; you pay for storage and compute together.", say: "That makes it fast and safe, with real transactions. But the data lives in the warehouse's own format, only its engine can read it, and you pay for storage and compute together." }

