    kind: slide
    chapter: "The data lake"
    slide: lake
    beats:
      - { id: b03, step: 1, show: "Lake: files on cheap storage (a folder, S3); open formats like Parquet.", say: "A data lake turns this around. The data is just files, on cheap storage: a folder, or a bucket on S3. In open formats, like Parquet." }
      - { id: b04, step: 2, show: "Engines around it: DuckDB, Spark, Trino, Python, all read the same files.", say: "Any engine can read those files: DuckDB, Spark, Trino, or a Python script. Storage and compute are separate." }

  - id: s03
    kind: slide
    chapter: "What plain files lack"
    slide: lacks
    beats:
      - { id: b05, step: 1, show: "No transactions: a reader can see half a write.", say: "But plain files have problems. There are no transactions: a reader can see a write that is only half done." }
      - { id: b06, step: 2, show: "No safe updates or deletes: you rewrite whole files.", say: "There are no safe updates or deletes. To change one row, you rewrite a whole file, and hope nobody reads it at that moment." }
      - { id: b07, step: 3, show: "No schema and no history: which columns, which version?", say: "And there is no schema and no history. Which columns does the table have, and what did it look like yesterday? The files do not say." }
      - { id: b08, step: 4, show: "Slow listing: listing thousands of files in a bucket.", say: "Even finding the files is slow: listing thousands of objects in a bucket, just to plan one query." }

  - id: s04
    kind: slide
    chapter: "The lakehouse"
    slide: lakehouse
    beats:
      - { id: b09, step: 1, show: "Lakehouse: open files plus a table format on top.", say: "The lakehouse fixes this, without giving up open files. It adds a table format on top: a small layer of metadata that says which files make up each table, right now." }
      - { id: b10, step: 2, show: "You get back: transactions, updates and deletes, schema changes, history and time travel.", say: "With that layer you get the warehouse features back: transactions, safe updates and deletes, schema changes, and a history you can travel back in. The data stays in open files." }

