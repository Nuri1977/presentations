      - { id: b12, step: 2, show: "Table format: the rules for tracking which files are a table.", say: "The table format: the rules for keeping track of which files make up a table, and how it changes." }
      - { id: b13, step: 3, show: "Catalog: where that tracking information lives.", say: "The catalog: where that tracking information is stored." }
      - { id: b14, step: 4, show: "Engine: the program that runs your queries, here DuckDB.", say: "And the engine: the program that reads it all and runs your queries. In this course, that is DuckDB." }

