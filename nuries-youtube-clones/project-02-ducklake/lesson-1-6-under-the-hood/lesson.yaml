        zoom: statusbar
        actions:
          - point_at: { text: "DuckDB: 1.5.2-r.1", label: "DuckDB version", hold: 900 }

  - id: s05
    kind: slide
    chapter: "Two engines, one lake"
    slide: twoengines
    beats:
      - { id: b10, step: 1, show: "Studio: DuckDB 1.5.2 (Node). dbt: DuckDB 1.5.6 (Python, inside dbt-duckdb). Both read and write the same lake.", say: "One more thing for later. When dbt runs, it uses its own DuckDB, the Python package inside dbt duckdb, version 1.5.6. So two engines read and write the same lake. We checked that they agree." }
      - { id: b11, step: 2, show: "With a DuckDB catalog file, only one of them can open the lake at a time.", say: "But with a DuckDB file as the catalog, only one of them can open it at a time. Keep that in mind for Module 6." }

