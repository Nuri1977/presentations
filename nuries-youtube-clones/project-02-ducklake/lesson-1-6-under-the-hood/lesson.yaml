  - id: s01
    kind: slide
    chapter: "Two processes"
    slide: electron
    beats:
      - { id: b01, step: 1, show: "Studio is an Electron app: a window (renderer) and a Node.js process (main).", say: "Before we build a lake, let's look under the hood. Rosetta DBT Studio is an Electron app. That means two parts: the window you see, and a Node.js process behind it." }
      - { id: b02, step: 2, show: "The window sends a request; the main process runs the SQL and sends back rows.", say: "The window never touches a database. When you run a query, it sends a request to the main process, which runs the SQL and sends back the rows." }

  - id: s02
    kind: slide
    chapter: "DuckDB inside the app"
    slide: node
    beats:
      - { id: b03, step: 1, show: "@duckdb/node-api 1.5.2: DuckDB's official Node.js package, in Studio's package.json.", say: "The main process uses DuckDB's official Node package, duck D B slash node A P I. Studio 1.7.6 ships version 1.5.2. DuckDB runs inside Studio itself: no server, nothing else to install." }
      - { id: b04, step: 2, show: "Code: DuckDBInstance.create(path) → instance.connect() → connection.run(sql).", say: "In Studio's code, it is three calls. Create a DuckDB instance. Connect to it. And run SQL on the connection." }

  - id: s03
    kind: slide
    chapter: "The DuckLake extension"
    slide: extension
    beats:
      - { id: b05, step: 1, show: "INSTALL ducklake; LOAD ducklake;", say: "DuckLake is not built into DuckDB. It is an extension. So on that connection, Studio first runs install ducklake, and load ducklake." }
      - { id: b06, step: 2, show: "ATTACH 'ducklake:<catalog file>' AS \"eth_lake\" (DATA_PATH '<folder>', AUTOMATIC_MIGRATION TRUE); USE \"eth_lake\";", say: "Then it attaches the lake: the catalog file, a name, and the data path. And it makes the lake the current database. That is exactly what you could type yourself." }
      - { id: b07, step: 3, show: "One adapter per catalog type: DuckDB (offered), SQLite and PostgreSQL (Soon). DETACH when the lake is closed.", say: "There is one adapter per catalog type. In 1.7.6 the wizard offers DuckDB; SQLite and PostgreSQL are marked as coming soon. When a lake is closed, Studio detaches it." }

