  - "Start state `lesson-4-4-end`: raw.blocks has 1 and 2 November; the table has fee_recipient and gas_used_pct since 3.3."
draft_changes:
  - "Studio's result pane re-runs a statement to page through its rows, so a CALL that returns rows runs twice; the first take registered the file twice. The call is wrapped in CREATE TEMP TABLE … AS SELECT, which runs once. The repo has two commits for this lesson (the first take, then the fix)."
  - "The landing folder is lake/landing, inside the ignored lake folder, so the file is never committed."
