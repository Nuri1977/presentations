    slide: rows
    beats:
      - { id: b01, step: 1, show: "A row file: each line holds a whole block, all columns.", say: "A CSV file stores data row by row. Each line is a whole record: every column of one Ethereum block." }
      - { id: b02, step: 2, show: "A column file: all numbers together, then all miners, then all counts.", say: "Parquet stores it column by column. All the block numbers together, then all the miners, then all the transaction counts." }
      - { id: b03, step: 3, show: "A query for two columns reads two columns, not the whole file.", say: "Why does that matter? Analytics queries use a few columns out of many. With columns stored apart, the engine reads only the ones it needs." }

