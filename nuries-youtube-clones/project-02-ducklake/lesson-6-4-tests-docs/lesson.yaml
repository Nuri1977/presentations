      - id: b08
        say: "And the lineage graph for this model: daily gas is built from stg transactions, the staging view on the raw transactions table. The full graph of the project, from both raw tables to all three marts, opens with the button at the top."
        actions:
          - click_at: { selector: "a[title='View Lineage Graph']", label: View Lineage Graph, settleMs: [500, 1500, 3000] }

