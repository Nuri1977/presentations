scenes:
  - id: s00
    kind: title
    slide: title
    show: "Project 2 · Lesson 6.4. Tests and docs on the lake."

  - id: s01
    kind: slide
    chapter: "Why tests"
    slide: why
    beats:
      - { id: b01, step: 1, show: "DuckLake: NOT NULL yes; primary keys, unique, foreign keys no.", say: "A DuckLake supports not null, but no primary keys, no unique constraints, and no foreign keys. Nothing stops a duplicate block from getting in." }
      - { id: b02, step: 2, show: "dbt tests check them after each build.", say: "So we check those rules with dbt tests, every time we build." }

  - id: s02
    kind: app
    chapter: "schema.yml"
    beats:
      - id: b03
        say: "In models, create schema dot yml. Descriptions for the models, unique and not null on the keys, accepted values on the success flag, and a relationship: every transaction's block number must exist in stg blocks."
        zoom: code-mid
        actions:
          - nav: DBT Studio
          - new_file: { folder: models, name: schema.yml }
          - paste: { text: "models:\n  - name: stg_blocks\n    description: One row per Ethereum block, with clear names and units.\n    columns:\n      - name: block_number\n        description: The block's height in the chain.\n        data_tests:\n          - unique\n          - not_null\n  - name: stg_transactions\n    description: One row per transaction, with values and fees in ether.\n    columns:\n      - name: transaction_hash\n        data_tests:\n          - not_null\n      - name: block_number\n        data_tests:\n          - relationships:\n              arguments:\n                to: ref('stg_blocks')\n                field: block_number\n      - name: succeeded\n        data_tests:\n          - accepted_values:\n              arguments:\n                values: [true, false]\n                quote: false\n  - name: daily_network_activity\n    description: One row per day with blocks, transactions, gas use and the average base fee.\n    columns:\n      - name: block_date\n        data_tests:\n          - unique\n          - not_null\n  - name: daily_gas\n    description: One row per day with transaction fees; built incrementally with a merge.\n    columns:\n      - name: block_date\n        data_tests:\n          - unique\n          - not_null\n" }
          - click_save
          - expect_file: { path: models/schema.yml, snippet: ../snippets/6.4/schema.yml }

  - id: s03
    kind: app
    chapter: "dbt build"
    beats:
      - id: b04
        say: "Run dbt build: it builds every model in order, and runs each model's tests right after it. Five models and nine tests: fourteen passes in all."
        zoom: terminal-close
        card: { eyebrow: "dbt build", title: "PASS=14", sub: "5 models + 9 tests, on the lake", pos: top-right }
        actions:
          - close_tab: models/schema.yml
          - terminal: { cmd: "dbt build", until: "Completed successfully", timeoutMs: 400000 }

  - id: s04
    kind: app
    chapter: "Docs"
    beats:
      - id: b05
        say: "Now the docs. Project menu, Generate Docs. dbt reads the project and the lake, and writes a small website into target."
        actions:
          - project_menu: Generate Docs
          - wait_text: { text: "Catalog written", label: docs generate, timeoutMs: 180000 }
      - id: b06
        say: "Then Project, Serve Docs. Studio starts a local web server, on port eighty eighty."
        actions:
          - project_menu: Serve Docs
          - wait_text: { text: "Serving docs at", label: docs serve, timeoutMs: 60000 }

  - id: s05
    kind: browser
    chapter: "The lineage"
    beats:
