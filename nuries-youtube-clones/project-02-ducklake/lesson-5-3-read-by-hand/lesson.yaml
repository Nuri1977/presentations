summary: "No magic: answer a query with only the catalog tables and read_parquet. Find the current snapshot, the table, the data path, the files valid at that snapshot, read exactly those files, and get the same count as the lake. This is what any engine must do to read DuckLake."
start_state: lesson-5-2-end
show_help_links: true
links:
  - { title: "DuckLake specification: queries", url: "https://ducklake.select/docs/stable/specification/queries" }
