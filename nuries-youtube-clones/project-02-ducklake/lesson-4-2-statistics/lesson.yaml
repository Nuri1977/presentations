        say: "Set it for transactions: sorted by block number. It applies to new writes, and to files that maintenance rewrites later."
        zoom: explorer
        actions:
          - sql_run: { line: 3, settleMs: [500, 1500, 2500] }
      - id: b09
        say: "Other settings live in the lake's options, like the inlining limit we set to zero. Others, like target file size and Parquet compression, are set with set option."
        zoom: sql-results
        actions:
          - sql_run: { line: 4, settleMs: [500, 1500, 2500] }

