  - id: s01
    kind: app
    chapter: "Statistics in the catalog"
    beats:
      - id: b01
        say: "In Data Lake, open the transactions table and its Statistics tab. For every column, the catalog keeps the smallest and the largest value. Block numbers go from about twenty-six million ninety-three thousand to twenty-six million one hundred forty-four thousand."
        zoom: center-wide
        actions:
          - nav: DataLake
          - click_at: { role: link, name: "DuckLake eth_lake", label: eth_lake, settleMs: [500, 1500, 2500] }
          - click_at: { text: transactions, label: transactions, settleMs: [500, 1500, 2500] }
          - click_at: { role: tab, name: Statistics, settleMs: [400, 1200, 2500] }
          - point_at: { text: block_number, label: block_number, hold: 900 }
      - id: b02
        say: "The catalog keeps the same numbers for every single file, so it can rule out files without opening them."
        zoom: center-wide

  - id: s02
    kind: app
    chapter: "Pruning in action"
    beats:
      - id: b03
        say: "In the SQL Editor, on eth lake: the first and last block number of the week."
        zoom: sql-results
        actions:
          - nav: SQL Editor
          - sql_connection: eth_lake
          - paste: |-
              select min(block_number) as first_block, max(block_number) as last_block from raw.transactions;
              explain analyze select count(*) from raw.transactions where block_number between 26100000 and 26100100;
              alter table raw.transactions set sorted by (block_number asc);
              select option_name, value from eth_lake.options();
          - sql_run: { line: 1, settleMs: [500, 1500, 2500] }
      - id: b04
        say: "Now ask for a hundred blocks, with explain analyze in front. It runs the query and returns the plan as text; Studio puts it on one line, so here is the part that matters, from the table scan: total files read, one. Six of the seven files were skipped, using only their statistics."
        zoom: sql-results
        card: { eyebrow: "EXPLAIN ANALYZE", title: "Total Files Read: 1", sub: "of 7, skipped by min and max", pos: top-right }
        actions:
          - sql_run: { line: 2, settleMs: [500, 1500, 3000] }

  - id: s03
    kind: slide
    chapter: "Keep ranges narrow"
    slide: sorted
    beats:
      - { id: b05, step: 1, show: "Narrow ranges per file = good pruning. Here block numbers grow with time, and each day is a file.", say: "Pruning works when each file covers a narrow range. Here it does: block numbers grow with time, and each day is its own file." }
      - { id: b06, step: 2, show: "Wide ranges (random order) = every file matches.", say: "If rows arrive in random order, every file covers almost everything, and nothing can be skipped." }
      - { id: b07, step: 3, show: "ALTER TABLE … SET SORTED BY (block_number ASC): new files are written sorted.", say: "Sorted by tells DuckLake to sort rows when it writes new files, so their ranges stay narrow." }

