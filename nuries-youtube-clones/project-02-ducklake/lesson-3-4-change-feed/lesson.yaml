accuracy_notes:
  - "Snapshots 9 to 10 with DuckDB 1.5.6 (dbt runtime): 7 deletes at 9; 72 update_preimage and 72 update_postimage at 10. With Studio's DuckDB 1.5.2 (ducklake 415a9ebd), on a lake written by 1.5.2 too: 79 deletes at 9 and 72 inserts at 10. table_insertions(8,8) = 7,176 and table_deletions(9,9) = 7 in both. Checked 12 Nov 2026."

scenes:
  - id: s00
    kind: title
    slide: title
    show: "Project 2 · Lesson 3.4. The data change feed."

  - id: s01
    kind: app
    chapter: "What changed?"
    beats:
      - id: b01
        say: "Remember Lesson 3.1? We deleted seven rows of blocks day at snapshot nine, and updated seventy-two at snapshot ten. Ask the lake what changed between those two snapshots."
        zoom: explorer
        actions:
          - nav: SQL Editor
          - sql_connection: eth_lake
          - paste: |-
              select snapshot_id, change_type, count(*) as row_count from ducklake_table_changes('eth_lake', 'raw', 'blocks_day', 9, 10) group by all order by 1, 2;
              select snapshot_id, change_type, number, extra_data from ducklake_table_changes('eth_lake', 'raw', 'blocks_day', 10, 10) order by number, change_type limit 4;
              select count(*) as inserted from ducklake_table_insertions('eth_lake', 'raw', 'blocks_day', 8, 8);
              select count(*) as deleted from ducklake_table_deletions('eth_lake', 'raw', 'blocks_day', 9, 9);
      - id: b02
        say: "Ducklake table changes, for schema raw, table blocks day, from nine to ten. Grouped by type, Studio's DuckDB, version 1.5.2, shows the update as a delete plus an insert: seventy-nine deletes, and seventy-two inserts at ten."
        zoom: sql-results
        card: { eyebrow: "DuckDB 1.5.2 in Studio", title: "79 deletes · 72 inserts", sub: "DuckDB 1.5.6: 7 deletes, 72 update pre- and post-images", pos: top-right }
        actions:
          - sql_run: { line: 1, settleMs: [500, 1500, 2500] }
      - id: b03
        say: "Look at the rows: each updated block appears twice, the old value in lower case, deleted, and the new value in upper case, inserted. Newer DuckDB, like the 1.5.6 inside dbt, labels these as update pre-image and post-image, and puts both at snapshot ten. Change feeds are young: check them on your version."
        zoom: sql-results
        actions:
          - sql_run: { line: 2, settleMs: [500, 1500, 2500] }
      - id: b04
        say: "And two shortcuts: table insertions, seven thousand one hundred seventy-six rows at snapshot eight, and table deletions, seven at snapshot nine."
        zoom: sql-results
        actions:
          - sql_run: { line: 3, settleMs: [500, 1500, 2500] }
          - sql_run: { line: 4, settleMs: [500, 1500, 2500] }

  - id: s02
    kind: slide
    chapter: "How and why"
    slide: why
    beats:
      - { id: b05, step: 1, show: "Change types: insert, delete, update_preimage, update_postimage.", say: "Four change types: insert, delete, and for updates, the pre-image and the post-image." }
      - { id: b06, step: 2, show: "Row lineage: every row has a stable row id, so the lake can follow it across snapshots.", say: "This works because every row in a DuckLake has a stable row id, kept across updates. That is called row lineage." }
      - { id: b07, step: 3, show: "Use: incremental loads downstream: process only what changed since last time.", say: "What is it for? Downstream jobs that only process what changed since their last run, instead of everything." }

  - id: s03
    kind: app
    chapter: "Commit and push"
    beats:
      - id: b08
        say: "Save the queries as 3 underscore 4 change feed dot sequel, commit, and push."
        zoom: git-panel
        actions:
          - nav: DBT Studio
          - new_file: { folder: sql, name: 3_4_change_feed.sql }
          - paste: |
              select snapshot_id, change_type, count(*) as row_count from ducklake_table_changes('eth_lake', 'raw', 'blocks_day', 9, 10) group by all order by 1, 2;
              select snapshot_id, change_type, number, extra_data from ducklake_table_changes('eth_lake', 'raw', 'blocks_day', 10, 10) order by number, change_type limit 4;
              select count(*) as inserted from ducklake_table_insertions('eth_lake', 'raw', 'blocks_day', 8, 8);
              select count(*) as deleted from ducklake_table_deletions('eth_lake', 'raw', 'blocks_day', 9, 9);
          - click_save
          - expect_file: { path: sql/3_4_change_feed.sql, snippet: ../snippets/3.4/3_4_change_feed.sql }
          - close_tab: sql/3_4_change_feed.sql
          - git_tab
          - git_stage_all
          - git_message: The data change feed
          - git_commit
          - git_push

