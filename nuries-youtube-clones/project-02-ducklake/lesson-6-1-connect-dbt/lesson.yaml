scenes:
  - id: s00
    kind: title
    slide: title
    show: "Project 2 · Lesson 6.1. Connect a dbt project to the lake."

  - id: s01
    kind: slide
    chapter: "dbt on the lake"
    slide: plan
    beats:
      - { id: b01, step: 1, show: "dbt reads raw.blocks and raw.transactions and writes models into eth_lake.main.", say: "In this module, dbt builds models on top of our lake. It reads the raw tables, and writes its models into the lake too, in the schema main." }
      - { id: b02, step: 2, show: "dbt runs its own DuckDB (1.5.6); it attaches the lake through profiles.yml.", say: "dbt runs its own DuckDB, inside dbt duckdb. So it needs to attach the lake itself. That is one change, in profiles dot yml." }

  - id: s02
    kind: app
    chapter: "The profile"
    beats:
      - id: b03
        say: "In DBT Studio, open profiles dot yml. Today it points at the small dev database from Lesson 2.1."
        zoom: code-mid
        actions:
          - nav: DBT Studio
          - open_file: profiles.yml
      - id: b04
        say: "Replace the output. Path is a small local DuckDB file for dbt's own session. Attach adds the lake: the ducklake prefix and the catalog file, as eth lake. Database eth lake makes the lake dbt's target, in schema main. And one thread, the safe choice with a single-file catalog: several dbt threads writing to one DuckLake can still trip over each other."
        zoom: code-mid
        actions:
          - paste: { replace: true, text: "ethereum_lake:\n  target: dev\n  outputs:\n    dev:\n      type: duckdb\n      path: lake/dbt_session.duckdb\n      attach:\n        - path: \"ducklake:lake/eth_catalog.duckdb\"\n          alias: eth_lake\n      database: eth_lake\n      schema: main\n      threads: 1\n" }
          - click_save
          - expect_file: { path: profiles.yml, snippet: ../snippets/6.1/profiles.yml }
      - id: b05
        say: "Check it: in the command box under the terminal, run dbt debug. dbt finds the project and the profile, attaches the lake, and connects. All checks passed."
        zoom: terminal-close
        card: { eyebrow: "dbt debug", title: "All checks passed!", sub: "dbt can open eth_lake", pos: top-right }
        actions:
          - terminal: { cmd: "dbt debug", until: "All checks passed", timeoutMs: 120000 }

  - id: s03
    kind: app
    chapter: "Commit and push"
    beats:
      - id: b06
        say: "Commit the profile: point dbt at the lake. And push."
        zoom: git-panel
        actions:
          - close_tab: profiles.yml
          - git_tab
          - git_stage_all
          - git_message: Point dbt at the lake
          - git_commit
          - git_push

  - id: s04
    kind: app
    chapter: "One program at a time"
    beats:
      - id: b07
        say: "Now the rule for this module. Open Data Lake, and the eth lake instance. Studio opens the lake, and keeps it open."
        zoom: center-wide
        actions:
          - nav: DataLake
          - click_at: { role: link, name: "DuckLake eth_lake", label: eth_lake, settleMs: [500, 1500, 2500] }
      - id: b08
        say: "Back in DBT Studio, run dbt debug again. This time it fails: conflicting lock is held in Rosetta DBT Studio. A DuckDB catalog file can be opened by one program at a time."
        zoom: terminal-close
        card: { eyebrow: "dbt debug", title: "Conflicting lock is held", sub: "the lake is open in Studio", pos: top-right }
        actions:
          - nav: DBT Studio
          - terminal: { cmd: "dbt debug", until: "Conflicting lock", timeoutMs: 120000 }

  - id: s05
    kind: slide
    chapter: "The rule"
    slide: rule
    beats:
      - { id: b09, step: 1, show: "Rule: run dbt first; open the Data Lake screens or the SQL Editor on the lake afterwards.", say: "So in this module, we always run dbt first, and open the lake in Studio afterwards, to look at the result." }
      - { id: b10, step: 2, show: "To run dbt again after that: quit Studio and open it again.", say: "Studio keeps the lake open until you quit it. To run dbt again after looking at the lake, quit Studio, and open it again. With a PostgreSQL catalog, this limit goes away." }

