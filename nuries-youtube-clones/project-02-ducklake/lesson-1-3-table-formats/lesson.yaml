    chapter: "What a format tracks"
    slide: track
    beats:
      - { id: b01, step: 1, show: "Three questions: which files, which schema, which version.", say: "Every table format answers the same three questions. Which files make up the table right now? What is its schema? And which version is this, so we can go back?" }

  - id: s02
    kind: slide
    chapter: "Apache Iceberg"
    slide: iceberg
    beats:
      - { id: b02, step: 1, show: "Iceberg: metadata JSON file → manifest list → manifests (Avro) → Parquet data files, all in the bucket.", say: "Apache Iceberg keeps its answers as files, in the same bucket as the data. A metadata file in JSON points to a manifest list, which points to manifest files, which finally list the Parquet data files." }
      - { id: b03, step: 2, show: "A catalog service holds the pointer to the current metadata file.", say: "And you still need a catalog service, which holds one pointer: the current metadata file of each table." }

