    kind: slide
    chapter: "Delta Lake"
    slide: delta
    beats:
      - { id: b04, step: 1, show: "Delta: a _delta_log folder of numbered JSON commits, plus Parquet checkpoints.", say: "Delta Lake also uses files. Each change is a numbered JSON file in a folder called delta log, and every so often a checkpoint file sums up the log." }

  - id: s04
    kind: slide
    chapter: "The cost"
    slide: cost
    beats:
      - { id: b05, step: 1, show: "Many small metadata files.", say: "Both designs work, and both are widely used. But they share some costs. Every change writes new small metadata files." }
      - { id: b06, step: 2, show: "Several round trips before reading any data.", say: "A query needs several round trips, file after file, before it reads a single row of data." }
      - { id: b07, step: 3, show: "And a catalog service to run anyway.", say: "And for real use you run a catalog service anyway, often backed by a database." }

  - id: s05
    kind: slide
    chapter: "DuckLake's idea"
    slide: idea
    beats:
      - { id: b08, step: 1, show: "If a database is needed anyway, put all the metadata in it: plain SQL tables.", say: "DuckLake starts from that last point. If you need a database for the catalog anyway, why not put all the metadata in it? Files, schemas, snapshots, statistics: all plain SQL tables." }
      - { id: b09, step: 2, show: "Data stays in Parquet files on any storage.", say: "The data itself stays exactly where it was: Parquet files, on a disk or in a bucket." }
      - { id: b10, step: 3, show: "A change is one database transaction; a read is one query to the catalog.", say: "Now a change is one database transaction, and finding the files for a query is one SQL query." }

