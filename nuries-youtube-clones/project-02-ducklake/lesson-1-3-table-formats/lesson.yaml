    chapter: "Side by side"
    slide: compare
    beats:
      - { id: b11, step: 1, show: "Table: metadata location, catalog, engines, age, for Iceberg, Delta Lake, DuckLake.", say: "Side by side. Iceberg and Delta keep metadata as files in the bucket, have many engines, and years of production use. DuckLake keeps metadata in a database, is read by DuckDB today, and is younger. In this course, we use DuckLake: it runs on a laptop with no services at all." }

