    slide: writers
    beats:
      - { id: b05, step: 1, show: "Optimistic concurrency: both writers work; at commit, the second is checked against what the first committed.", say: "What about two writers at the same time? DuckLake is optimistic. Both work without locking. When the second one commits, it is checked against what the first one already committed." }
      - { id: b06, step: 2, show: "No conflict: two appends to the same table; changes to different tables.", say: "Two inserts into the same table do not conflict, and neither do changes to different tables. DuckLake simply retries the commit on top." }
      - { id: b07, step: 3, show: "Conflict: both delete from the same data file; both change the same table's schema. The second commit fails.", say: "But if both delete rows from the same data file, or both change the same table's schema, the second commit fails, and that writer must try again." }

