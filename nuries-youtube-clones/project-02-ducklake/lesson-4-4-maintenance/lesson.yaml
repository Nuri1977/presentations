  - id: s01
    kind: slide
    chapter: "Why maintenance"
    slide: why
    beats:
      - { id: b01, step: 1, show: "Every load adds files; old files stay for time travel; delete files pile up.", say: "A lake grows untidy. Every load adds files, old files stay around for time travel, and delete files pile up." }
      - { id: b02, step: 2, show: "The recommended order: merge, expire, clean up. CHECKPOINT runs them together.", say: "DuckLake's recommended routine has three steps: merge small files, expire old snapshots, and clean up files nobody needs. Checkpoint runs them all together." }

  - id: s02
    kind: app
    chapter: "Merge"
    beats:
      - id: b03
        say: "In the SQL Editor, on eth lake: count the Parquet files on disk. Nineteen."
        zoom: sql-results
        actions:
          - nav: SQL Editor
          - sql_connection: eth_lake
          - paste: |-
              select count(*) as files from glob('/Users/Shared/academy/learner/projects/ethereum_lake/lake/data/**/*.parquet');
              call ducklake_merge_adjacent_files('eth_lake');
              select count(*) as files from glob('/Users/Shared/academy/learner/projects/ethereum_lake/lake/data/**/*.parquet');
              select snapshot_id, changes from eth_lake.snapshots() where snapshot_id in (6, 7);
              call ducklake_expire_snapshots('eth_lake', versions => [6, 7]);
              call ducklake_cleanup_old_files('eth_lake', dry_run => true, cleanup_all => true);
              call ducklake_cleanup_old_files('eth_lake', cleanup_all => true);
              select count(*) as files from glob('/Users/Shared/academy/learner/projects/ethereum_lake/lake/data/**/*.parquet');
              checkpoint;
          - sql_run: { line: 1, settleMs: [500, 1500, 2500] }
      - id: b04
        say: "Merge adjacent files. Studio shows no result rows for this call, but behind it, the four files of the blocks table, the three months and the November days, became one."
        zoom: sql-results
        actions:
          - sql_run: { line: 2, settleMs: [1000, 3000] }
          - sql_wait
      - id: b05
        say: "Count again: twenty. One more, not fewer: the new file is written, and the four old ones are still on disk."
        zoom: sql-results
        actions:
          - sql_run: { line: 3, settleMs: [500, 1500, 2500] }

  - id: s03
    kind: app
    chapter: "Expire and clean up"
    beats:
      - id: b06
        say: "Snapshots six and seven are the October copy we made and dropped in Lesson 2.5. We will never travel back to them. Expire them. Again Studio shows no rows, but they are gone."
        zoom: sql-results
        actions:
          - sql_run: { line: 4, settleMs: [500, 1500, 2500] }
          - sql_run: { line: 5, settleMs: [500, 1500, 2500] }
      - id: b07
        say: "Now clean up old files. First a dry run, which only lists what it would delete: the files of that October copy, and the files the merge replaced."
        zoom: sql-results
        actions:
          - sql_run: { line: 6, settleMs: [500, 1500, 2500] }
      - id: b08
        say: "Run it for real, and count: fourteen files. And time travel still works: the merged file keeps every row's history."
        zoom: sql-results
        card: { eyebrow: "Parquet files on disk", title: "19 → 20 → 14", sub: "merge, then expire and clean up", pos: top-right }
        actions:
          - sql_run: { line: 7, settleMs: [500, 1500, 2500] }
          - sql_run: { line: 8, settleMs: [500, 1500, 2500] }
      - id: b09
        say: "In practice, you just run checkpoint, now and then. It flushes inlined data, merges, expires and cleans up, following the lake's options."
        zoom: sql-results
        actions:
          - sql_run: { line: 9, settleMs: [800, 2500, 4500] }
          - sql_wait

  - id: s04
    kind: slide
    chapter: "Careful"
    slide: careful
    beats:
      - { id: b10, step: 1, show: "Expiring a snapshot ends time travel to it. Cleanup deletes files for good.", say: "Be careful with two things. Expiring a snapshot ends time travel to it, for good. And cleanup really deletes files." }
      - { id: b11, step: 2, show: "Files no snapshot knows (a crash mid-write): ducklake_delete_orphaned_files.", say: "Files that no snapshot ever knew about, for example after a crash in the middle of a write, are removed with delete orphaned files." }

