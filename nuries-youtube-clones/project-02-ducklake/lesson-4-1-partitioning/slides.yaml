number: "4.1"
title: Partitioning
slides:
  - { id: title, type: title, h1: '<span class="accent">Partitioning</span>', lead: "A week of transactions, one folder per day.", badges: [PARTITIONED BY, 12.7 million rows, File pruning] }
  - id: why
    type: html
    eyebrow: Why partition
    h2: Most questions ask about a day
    html: |
      <div class="row two" style="margin-top:30px">
        <div class="card s" data-step="1"><div class="k">raw.transactions</div><div class="t">12.7 million rows</div><div class="d">one week, about 1.7 GB</div></div>
        <div class="codecard s" data-step="2"><div class="filetab"><span class="ic"></span>lake/data/raw/transactions/</div><div class="tree"><span class="dir">date=2026-10-01/</span>  <span class="pq">ducklake-….parquet</span>
      <span class="dir">date=2026-10-02/</span>  <span class="pq">ducklake-….parquet</span>
      <span class="dir">date=2026-10-03/</span>  <span class="pq">ducklake-….parquet</span>   <span class="dimc">← where date = 2026-10-03</span>
      <span class="dimc">…</span></div></div>
      </div>
  - id: key
    type: cards
    eyebrow: Choosing a key
    h2: Few values, used in filters
    cols: 2
    cards:
      - { step: 1, cls: good, k: Good keys, t: "date, month", d: "what your queries filter on" }
      - { step: 1, cls: bad, k: Bad keys, t: "address, hash", d: "millions of values: millions of tiny files" }
    note: { step: 2, size: 32, text: "<span class=\"mono\">ALTER TABLE … SET PARTITIONED BY (year(block_timestamp), month(block_timestamp))</span>: applies to new data only." }
    checked: Checked against the DuckLake docs on 11 Nov 2026
  - id: recap
    type: recap
    items:
      - "<span class=\"mono\">raw.transactions</span> is partitioned by date."
      - "One folder per day on disk."
      - "A one-day query opens one file."
      - "A new key applies to new data only."
  - { id: closing, type: closing, lesson: Lesson 4.2, h2: 'Statistics and <span class="accent">pruning</span>' }
