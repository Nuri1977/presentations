    kind: app
    chapter: "The table in Studio"
    beats:
      - id: b01
        say: "Open Data Lake, then eth lake, and click the blocks table. Studio opens the table's own page."
        zoom: center-wide
        actions:
          - nav: DataLake
          - click_at: { role: link, name: "DuckLake eth_lake", label: eth_lake, settleMs: [500, 1500, 2500] }
          - click_at: { text: blocks, label: blocks, settleMs: [500, 1500, 2500] }
