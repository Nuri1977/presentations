  - id: s02
    kind: app
    chapter: "The same in SQL"
    beats:
      - id: b04
        say: "The same list is one function in SQL. In the SQL Editor, on eth lake, ducklake list files gives each data file of the table, and its size."
        zoom: explorer
        actions:
          - nav: SQL Editor
          - sql_connection: eth_lake
          - paste: |-
              select data_file, data_file_size_bytes from ducklake_list_files('eth_lake', 'blocks', schema => 'raw');
              select file from glob('/Users/Shared/academy/learner/projects/ethereum_lake/lake/data/**/*.parquet');
              select count(*) as blocks from read_parquet('/Users/Shared/academy/learner/projects/ethereum_lake/lake/data/raw/blocks/*.parquet');
          - sql_run: { line: 1, settleMs: [500, 1500, 2500] }
      - id: b05
        say: "The files are on your disk. Glob lists every Parquet file under the lake's data folder: the same three, in a folder per schema and table."
        zoom: sql-results
        actions:
          - sql_run: { line: 2, settleMs: [500, 1500, 2500] }
      - id: b06
        say: "And they are plain Parquet. Read them directly, without the lake, and you get the same six hundred sixty thousand rows."
        zoom: sql-results
        card: { eyebrow: "read_parquet on the files", title: "659,896 rows", sub: "the same as raw.blocks", pos: top-right }
        actions:
          - sql_run: { line: 3, settleMs: [500, 1500, 3000] }

  - id: s03
    kind: slide
    chapter: "Files and catalog"
    slide: point
    beats:
      - { id: b07, step: 1, show: "Any tool can read the files.", say: "So any tool that reads Parquet can read these files." }
      - { id: b08, step: 2, show: "Only the catalog knows which files are the table now: after a delete or an update, reading all files gives the wrong answer.", say: "But only the catalog knows which files make up the table right now. After a delete or an update, the folder also holds files that are no longer current, and delete files. Reading the folder directly would give the wrong answer. That is what the catalog is for." }

