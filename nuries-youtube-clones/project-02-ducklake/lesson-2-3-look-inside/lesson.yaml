        say: "The Schema tab lists the columns and their types, as the catalog stores them."
        zoom: center-wide
        actions:
          - click_at: { role: tab, name: Schema, settleMs: [400, 1200, 2200] }
      - id: b03
        say: "And Data Files: three Parquet files, one per load. August, September, and October, each about seventy megabytes, with its row count and the snapshot that added it."
