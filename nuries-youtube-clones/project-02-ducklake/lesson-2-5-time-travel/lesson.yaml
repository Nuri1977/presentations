  - id: s01
    kind: app
    chapter: "Query the past"
    beats:
      - id: b01
        say: "In the SQL Editor, on eth lake, start with the table as it is now: six hundred sixty-seven thousand blocks, three months and one day."
        zoom: sql-results
        actions:
          - nav: SQL Editor
          - sql_connection: eth_lake
          - paste: |-
              select count(*) as blocks from raw.blocks;
              select count(*) as blocks from raw.blocks at (version => 2);
              select strftime(date, '%Y-%m') as month, count(*) as blocks from raw.blocks at (version => 3) group by all order by 1;
              create table raw.blocks_october as select * from raw.blocks at (version => 4) where date >= date '2026-10-01';
              select count(*) as blocks from raw.blocks_october;
              drop table raw.blocks_october;
          - sql_run: { line: 1, settleMs: [500, 1500, 2500] }
      - id: b02
        say: "Now add at, version equals two. That is the table as it was at snapshot two, right after we loaded August: two hundred twenty-two thousand blocks."
        zoom: sql-results
        card: { eyebrow: "AT (VERSION => 2)", title: "222,412 blocks", sub: "August only", pos: top-right }
        actions:
          - sql_run: { line: 2, settleMs: [500, 1500, 2500] }
      - id: b03
        say: "Any query works on the past. Blocks per month at version three: August and September, no October yet."
        zoom: sql-results
        actions:
          - sql_run: { line: 3, settleMs: [500, 1500, 2500] }

  - id: s02
    kind: app
    chapter: "Bring the past back"
    beats:
      - id: b04
        say: "Time travel also helps you recover data. Create a table from the past: October, as it was at version four, before the November day came in."
        zoom: explorer
        actions:
          - sql_run: { line: 4, settleMs: [800, 2500, 4500] }
          - sql_wait
      - id: b05
        say: "It holds exactly the October blocks: two hundred twenty-two thousand four hundred fifty-one. We only needed it for the demo, so drop it again."
        zoom: sql-results
        actions:
          - sql_run: { line: 5, settleMs: [500, 1500, 2500] }
          - sql_run: { line: 6, settleMs: [500, 1500, 2500] }

  - id: s03
    kind: slide
    chapter: "More ways to travel"
    slide: more
    beats:
      - { id: b06, step: 1, show: "By time: AT (TIMESTAMP => now() - INTERVAL '1 day').", say: "You can also travel by time: at timestamp, for example now minus one day." }
