<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Expectation Met Thumbnail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; }
  #thumb {
    position: relative; width: 1080px; height: 1920px; overflow: hidden; color: #e8edf3;
    font-family: Inter, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(ellipse 80% 30% at 50% 33%, rgba(120,20,20,0.55), transparent 70%),
      radial-gradient(ellipse 80% 26% at 50% 66%, rgba(30,110,60,0.4), transparent 70%),
      #090c11;
  }
  .grad { background: linear-gradient(180deg, #ffb054 4%, #ff7317 58%, #df4c08 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hl { position: absolute; left: 0; right: 0; text-align: center; font-weight: 900; letter-spacing: -0.045em; line-height: 1; white-space: nowrap; }
  /* the terminal from the video's own frame at 5.6 s (thumbnail-reality.png) */
  #term {
    position: absolute; left: 60px; top: 450px; width: 961px; height: 561px; border-radius: 18px; overflow: hidden;
    background: url(thumbnail-reality.png) -62px -1148px no-repeat; transform: rotate(-1.5deg);
    box-shadow: 0 0 0 3px rgba(255,75,64,0.6), 0 0 90px rgba(255,75,64,0.35), 0 40px 80px rgba(0,0,0,0.6);
  }
  /* rubber stamps, same style as the video */
  .stamp {
    position: absolute; left: 540px; padding: 10px 30px 12px; border: 7px solid currentColor; border-radius: 16px;
    font-weight: 900; letter-spacing: 0.08em; white-space: nowrap; line-height: 1;
  }
  #r-stamp { top: 300px; font-size: 84px; color: #ff4b40; transform: translateX(-50%) rotate(-3deg); background: rgba(40,6,6,0.6); }
  #e-exp { top: 1090px; font-size: 104px; letter-spacing: 0.02em; }
  #e-met { top: 1215px; font-size: 230px; color: #5fd47a; padding: 6px 44px 18px; border-width: 12px; letter-spacing: 0.02em; transform: translateX(-50%) rotate(-4deg); }

  #top { top: 110px; font-size: 128px; }
  #icon { position: absolute; left: 480px; top: 1545px; width: 120px; height: 120px; }
  #icon svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 20px 50px rgba(255,116,22,0.35)); }
  #name { position: absolute; left: 0; right: 0; top: 1690px; text-align: center; }
  .ros { font-size: 34px; font-weight: 700; letter-spacing: 0.34em; margin-left: 0.34em; color: #ffc08a; }
  .nm { font-size: 104px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; margin-top: 6px; }
</style>
</head>
<body>
<div id="thumb">
  <div id="top" class="hl">Setting up <span class="grad">dbt</span></div>
  <div id="r-stamp" class="stamp">REALITY</div>
  <div id="term"></div>
  <div id="e-exp" class="hl">EXPECTATION:</div>
  <div id="e-met" class="stamp">MET.</div>
  <div id="icon"></div>
  <div id="name"><div class="ros">ROSETTA</div><div class="nm">DBT <span class="grad">Studio</span></div></div>
</div>
<script>
// the Rosetta DBT Studio logo (same drawing as motion.html)
const f = (pts, c) => `<polygon points="${pts}" fill="${c}" stroke="${c}" stroke-width="9" stroke-linejoin="round"/>`;
document.getElementById('icon').innerHTML = `<svg viewBox="-40 -40 560 560">
  <defs><linearGradient id="spg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb054"/><stop offset="1" stop-color="#f0600e"/></linearGradient></defs>
  <path d="M420 262 V50 A70 70 0 0 0 350 -20 H50 A70 70 0 0 0 -20 50 V350 A70 70 0 0 0 50 420 H262" fill="none" stroke="#ff7a1f" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <g>${f('46,263 198,331 198,384 46,317', '#fb9145')}${f('198,331 346,263 346,317 198,384', '#f7641f')}</g>
  <g>${f('46,182 198,249 198,304 46,236', '#fc8939')}${f('198,249 346,182 346,236 198,304', '#f7641f')}<circle cx="236" cy="259" r="11.5" fill="#07090d"/></g>
  <g>${f('198,22 346,88 198,156 46,88', '#fc7927')}${f('46,88 198,156 198,222 46,154', '#fd8a37')}${f('198,156 346,88 346,154 198,222', '#f5621f')}</g>
  <path d="M400 306 C409 372 428 391 494 400 C428 409 409 428 400 494 C391 428 372 409 306 400 C372 391 391 372 400 306 Z" fill="url(#spg)"/>
</svg>`;
</script>
</body>
</html>
