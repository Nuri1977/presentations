<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apache Iceberg in Rosetta DBT Studio v1.6.7</title>
    <style>
        :root {
            --text: #ffffff;
            --muted: #d7dce8;
            --orange: #ff7a1a;
            --orange-2: #ff9a3d;
            --line: rgba(255, 255, 255, 0.16);
        }
        * { box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; margin: 0; overflow: hidden;
            background: #05060a; color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .slide {
            position: absolute; inset: 0; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .bg {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; filter: none; opacity: 1;
        }
        .shade {
            position: absolute; inset: 0;
            background:
                linear-gradient(90deg, rgba(5,6,10,0.85) 0%, rgba(5,6,10,0.7) 45%, rgba(5,6,10,0.3) 100%),
                linear-gradient(0deg, rgba(5,6,10,0.6), rgba(5,6,10,0.1) 60%);
        }
        
        .content {
            position: relative; z-index: 10;
            width: min(1000px, 90vw);
            padding: clamp(32px,5vw,64px);
            border: 1px solid var(--line); border-radius: 16px;
            background: rgba(8,10,15,0.65);
            box-shadow: 0 40px 100px rgba(0,0,0,0.7);
            backdrop-filter: blur(28px);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .eyebrow {
            display: inline-flex; align-items: center; gap: 10px;
            margin-bottom: 24px; color: var(--orange-2);
            font-size: clamp(15px,1.3vw,19px); font-weight: 850;
            text-transform: uppercase; letter-spacing: 0.14em;
        }
        .eyebrow::before, .eyebrow::after {
            width: 40px; height: 3px; content: ""; border-radius: 99px;
            background: linear-gradient(90deg, var(--orange), var(--orange-2));
        }
        
        .title-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 24px;
        }
        
        .iceberg-logo {
            height: clamp(120px, 14vw, 160px);
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }

        h1 {
            margin: 0; color: var(--text);
            letter-spacing: -0.02em; line-height: 1.1;
            font-weight: 920; text-wrap: balance;
            font-size: clamp(56px,7vw,92px);
        }
        .subtitle {
            margin: 0; color: var(--muted);
            font-size: clamp(20px,1.8vw,28px);
            line-height: 1.5; font-weight: 500; text-wrap: balance;
            max-width: 800px;
        }
        .accent { color: var(--orange-2); }
        
        .tagline {
            display: inline-flex; align-items: center; gap: 8px;
            margin: 32px 0 0; padding: 10px 20px; border-radius: 30px;
            background: rgba(255,122,26,0.15); border: 1px solid rgba(255,122,26,0.4);
            color: var(--orange-2); font-weight: 800; font-size: 16px;
            letter-spacing: 0.05em; text-transform: uppercase;
        }

        .hero-badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin-top: 48px; }
        .badge {
            display: inline-flex; align-items: center; gap: 10px;
            min-height: 52px; padding: 12px 24px;
            border: 1px solid var(--line); border-radius: 8px;
            background: rgba(255,255,255,0.08);
            color: var(--text); font-size: clamp(17px,1.2vw,20px); font-weight: 700;
            white-space: nowrap; backdrop-filter: blur(20px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        }
        .badge::before {
            width: 10px; height: 10px; content: ""; border-radius: 50%;
            background: var(--orange); box-shadow: 0 0 20px rgba(255,122,26,0.8);
        }
    </style>
</head>
<body>
    <section class="slide">
        <!-- Using a different wide background, the tables view, slightly lighter shade -->
        <img class="bg" src="assets/12-instance-tables-views-lakekeeper.png" alt="Iceberg SQL Editor">
        <div class="shade"></div>
        <div class="content">
            <div class="eyebrow">Rosetta DBT Studio</div>
            
            <div class="title-group">
                <img class="iceberg-logo" src="assets/iceberg-logo-icon.png" alt="Apache Iceberg">
                <h1>Apache Iceberg <span class="accent">DataLakes</span></h1>
            </div>
            
            <p class="subtitle">Connect, explore, and query any Iceberg catalog directly from your desktop. Seamless integration with Nessie, Polaris, Lakekeeper, and Hive.</p>
            
            <div class="tagline">🚀 v1.6.7 Available Now</div>
            
            <div class="hero-badges">
                <span class="badge">ACID Transactions</span>
                <span class="badge">Time Travel</span>
                <span class="badge">Multi-Catalog Support</span>
            </div>
        </div>
    </section>
</body>
</html>
