<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <pattern id="small-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(15, 23, 42, 0.03)" stroke-width="1" />
    </pattern>
    <pattern id="large-grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="url(#small-grid)" />
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="rgba(249, 115, 22, 0.07)" stroke-width="1.2" />
      <circle cx="120" cy="120" r="1.5" fill="rgba(249, 115, 22, 0.25)" />
      <circle cx="0" cy="0" r="1.5" fill="rgba(249, 115, 22, 0.25)" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" />
  <rect width="100%" height="100%" fill="url(#large-grid)" />
</svg>
